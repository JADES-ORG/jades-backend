spring.application.name=jades-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_JADES}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1200000}

app.productos.imagenes.directorio=${PRODUCTOS_IMAGENES_DIR:./uploads/productos}
app.productos.imagenes.base-url=${PRODUCTOS_IMAGENES_BASE_URL:http://localhost:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.recuperacion.demo.habilitada=${JADES_RECUPERACION_DEMO:false}
